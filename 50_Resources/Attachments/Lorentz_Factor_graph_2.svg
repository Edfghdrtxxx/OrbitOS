   <path d="M 0,0 H 1000 V 1000 H 0 Z M 0,699 H 999" fill="none" stroke="#9cf"/>
   <path d="M 0,301 H 999 M 0,477 H 999 M 0,602 H 999 M 0,778 H 999 M 0,845 H 999 M 0,903 H 999 M 0,954 H 999" stroke="#cef"/>
  </pattern>
 </defs>
 <circle cx="0" cy="0" r="99999" fill="#fff"/>
