<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%" viewBox="-520 -5500 6200 6200">
 <title>Lorentz factor log log</title>
 <desc>Log-log plot of Lorentz factor γ and 1−γ vs fraction of speed of light β (bottom) and 1 − β (top) showing near-linearity in log-log scale by CMG Lee.</desc>
