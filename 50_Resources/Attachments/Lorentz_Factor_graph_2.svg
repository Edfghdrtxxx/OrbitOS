 <g id="GENERATED_CONTENT">
  <path d="M 0,0 L 5,-0 L 10,-0 L 15,-1 L 25,-3 L 40,-6 L 50,-9 L 100,-32 L 150,-62 L 250,-137 L 400,-267 L 500,-361 L 1000,-851 L 1500,-1350 L 2500,-2349 L 4000,-3849 L 5000,-4849 L 5200,-5049" fill="none" stroke="#c00"/>

  </g>
 <g id="GENERATOR_SCRIPT"><!--script>
/// To recover the generator script, delete the "!" and 2 "-" on the line above
/// and the 2 "-" on the last line below.  Amend the SVG-specific JavaScript as
/// needed. Open the file in Firefox. Save As another SVG to upload to Commons.
<![CDATA[
const outs = []; /// SVG may be pushed into this array even if outs is a const.
/// ======================== SVG-specific JavaScript ==========================

function outX(x)     { return (  500 * x).toFixed(0); }
function outY(y)     { return (-1000 * y).toFixed(0); }
function outXY(x, y) { return outX(x) + ',' + outY(y); }

const outXYs = [];
const nNines = [0,0.01,0.02,0.03,0.05,0.08,0.1,0.2,0.3,0.5,0.8,1,2,3,5,8,10,10.4];
for (let iNine = 0; iNine < nNines.length; ++iNine) {
 let nNine        = nNines[iNine];
 let oneMinusBeta = Math.pow(1.0 / 10, nNine);
 let beta         = 1 - oneMinusBeta;
 let gamma        = Math.pow(oneMinusBeta * (2 - oneMinusBeta), -0.5);
 let lgGamma      = Math.log10(gamma);
 // let gamma     = 1 / Math.sqrt(1 - beta * beta);
 // let lgGamma   = Math.log10(gamma);
 console.log(nNine, beta, gamma, lgGamma, outXY(nNine,lgGamma));
 outXYs.push(outXY(nNine,lgGamma));
}
outs.push(`  <path d="M ${outXYs.join(' L ')}" fill="none" stroke="#c00"/>`);

/// ============= JavaScript SVG generator by TilmannR and cmglee =============
document.getElementById('GENERATED_CONTENT').innerHTML =
                      `\n${outs.join('')}\n\n  `;
const generator     = document.getElementById('GENERATOR_SCRIPT');
generator.innerHTML = generator.innerHTML.
                       replace(/[<]script[^>]*/, `<!-${''}-script`).
                       replace(/<[/]script>/, `</script-${''}->`);
]]></script--></g></svg>