  <path transform="rotate(180)" d="M -10300,5000 v 60 H 0 V  -155 z"/>
  <path transform="rotate(  0)" d="M 10300,-5000 V 50 H 0 V 0 q 250,-1 1000,-360 z"/>
 </g>
